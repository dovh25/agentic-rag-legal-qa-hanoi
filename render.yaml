services:
  - type: web
    name: legal-qa-hanoi-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: Agentic RAG Legal QA Hanoi
      - key: DEBUG
        value: "false"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.mistral.ai/v1
      - key: MODEL_NAME
        value: mistral-small-latest
      - key: LLM_PROVIDER
        value: mistral
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: legal_chunks
      - key: QDRANT_ACTIVE_ALIAS
        value: legal_chunks
      - key: CORPUS_VERSION
        value: 2026-10-09.2
      - key: EMBEDDING_REVISION
        value: bge-m3-1024-v1

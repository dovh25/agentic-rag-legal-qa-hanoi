services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legal-qa-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - qdrant
    volumes:
      - ./src:/app/src
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: legal-qa-qdrant
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:

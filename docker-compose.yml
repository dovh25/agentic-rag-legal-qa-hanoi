services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legal-qa-api
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    env_file:
      - .env
    depends_on:
      - qdrant
    volumes:
      - ./src:/app/src
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: legal-qa-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
